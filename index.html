<style>

}
@media (prefers-color-scheme: dark){

    --line:#2e3440; --accent:#8db8e3; --accent-soft:#22324a; --warm:#e0a066; --warm-soft:#3a2b1d;
    --ok:#6fcf97; --danger:#ff8a80; --mark:#7a6420; --shadow:none; --hub:#c9a6ec; --hub-soft:#33284a; --c3:#7fc59a;
  }
}
:root[data-theme="dark"]{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 120px}

.top-in{max-width:780px;margin:0 auto;padding:10px 16px 8px}
.title-row{display:flex;align-items:center;gap:8px}

.search{display:flex;gap:8px;margin-top:8px}

.tab{scroll-snap-align:center}
.pubbtn{border:0;background:var(--warm);color:#fff;border-radius:9px;padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.cat-row{display:grid;grid-template-columns:1fr 1.6fr auto;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px}

.form select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 10px;width:100%;font-size:15px}
.chk{flex-direction:row!important;align-items:center;gap:6px!important;color:var(--ink-2)!important;font-size:13.5px!important}
.chk input{width:auto!important}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink-2)}
.tab b{font-weight:600;margin-left:4px;color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}

.banner{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:var(--warm-soft);color:var(--ink);font-size:13px;display:flex;gap:10px;align-items:center}
.banner span{flex:1}
.banner button{border:0;background:var(--warm);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;white-space:nowrap}
.meta{color:var(--muted);font-size:12.5px;margin:12px 2px 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.list{display:flex;flex-direction:column;gap:10px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}

.vlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.visit.flash .v-t{animation:flash 1.4s ease}

.body{display:none;border-top:1px solid var(--line);padding:4px 14px 14px}

.v-t{white-space:pre-wrap;word-break:break-word;font-size:14.5px}

.card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.card-t{white-space:pre-wrap;word-break:break-word;font-size:13.5px;color:var(--ink-2)}
.card-t .l1{color:var(--ink);font-weight:600}
.card-img-btn{margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--accent)}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:13.5px;color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#10141b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#10141b}}
.btn.dan{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.form label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.form input,.form textarea{color:var(--ink);font-size:15px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;outline:none;width:100%}
.form input:focus,.form textarea:focus{border-color:var(--accent)}
.form textarea{min-height:110px;resize:vertical;line-height:1.6}
.ed-item{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2)}
.ed-item .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:12.5px;color:var(--muted)}
.thumb{max-width:140px;max-height:90px;border-radius:6px;border:1px solid var(--line);display:block}
.fab{position:fixed;right:max(16px,calc(50% - 374px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:15;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(20,40,80,.28)}
body.editing .fab{display:none}
:root[data-theme="dark"] .fab{color:#10141b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{color:#10141b}}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 4px;font-size:16px}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox.zoom{align-items:flex-start;justify-content:flex-start}
.lightbox.zoom img{max-width:none;max-height:none;width:200%}
.lb-x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:61;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;width:36px;height:36px;font-size:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.menu{position:absolute;right:16px;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.15);padding:6px;z-index:30;min-width:220px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--surface-2)}
.menu small{display:block;color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
a.xref{color:var(--accent);text-decoration:underline;text-decoration-style:solid;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer;font-weight:600}
a.xref.hub{color:var(--hub);text-decoration-style:dotted}
a.xref.flashlink{animation:flash 1.6s ease;border-radius:3px}
.bdg.lk{background:var(--hub-soft);color:var(--hub);border-color:transparent}
.rel{display:flex;flex-direction:column;gap:6px}
.rel-i{display:flex;gap:8px;align-items:baseline;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;text-align:left;width:100%;font-size:13.5px}
.rel-i .k{flex:0 0 auto;font-size:12px;color:var(--muted);min-width:46px}
.rel-i .n{font-weight:600;color:var(--accent)}
.rel-i.h .n{color:var(--hub)}
.rel-i .s{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.rel-i .s b{color:var(--ink-2);font-weight:600}
.backpill{position:fixed;left:max(16px,calc(50% - 374px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:16;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.g{border-style:dashed}
.tab.g.on{border-style:solid}
body.graph .meta,body.graph #sort,body.graph .fab{display:none}
.g-box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.g-box svg{display:block;width:100%;height:62vh;min-height:360px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.g-tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}

.g-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

svg .e{stroke:var(--muted);stroke-opacity:.55;fill:none}

svg .n.sel text{font-weight:700}
svg .n.qhit circle,svg .n.qhit rect{stroke:var(--mark);stroke-width:4}
.g-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.g-panel h3{margin:0 0 2px;font-size:16px}
.g-panel .sub{margin-bottom:8px}
.g-hint{color:var(--muted);font-size:13px}
.comp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.comp b{font-weight:600}
.comp .ch{display:inline-block;margin:3px 6px 3px 0;padding:1px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}

.hubs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
body.locked header.top,body.locked .wrap,body.locked .fab{display:none}
.lock{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px 16px}
body.locked .lock{display:flex}
.lock form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;box-shadow:var(--shadow);text-align:center}
.lock svg{color:var(--accent)}
.lock h2{font-size:17px;margin:10px 0 4px}
.lock p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.lock input{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:16px;outline:none;text-align:center;letter-spacing:.1em}
.lock input:focus{border-color:var(--accent)}
.lock button{width:100%;margin-top:12px;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px;font-size:15px;font-weight:600}
:root[data-theme="dark"] .lock button{color:#10141b}

.lock button:disabled{opacity:.6}
.lkmsg{min-height:20px;margin-top:10px;font-size:13px;color:var(--danger)}
</style>
</head>

/* ---------- crypto (AES-256-GCM, key from PBKDF2-SHA256) ---------- */
function b64e(buf){ var b=new Uint8Array(buf), s=''; for(var i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(s); }
function b64d(s){ var bin=atob(s), b=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
function derive(pw, salt, iter){
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:iter, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  });
}
function decryptWith(key, o){
  return crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(o.iv)}, key, b64d(o.ct)).then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
}
function encryptPayload(obj){
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, CK.key, new TextEncoder().encode(JSON.stringify(obj))).then(function(ct){
    return {v:1, alg:'AES-GCM/PBKDF2-SHA256', iter:CK.iter, salt:b64e(CK.salt), iv:b64e(iv), ct:b64e(ct)};
  });
}
function unlock(pw){
  var fsalt = b64d(ENC.salt);
  return derive(pw, fsalt, ENC.iter).then(function(fkey){
    return decryptWith(fkey, ENC).then(function(P){
      CK = {key:fkey, salt:fsalt, iter:ENC.iter};
      var raw = lsGet(LSKEY), L = null;
      try{ L = raw ? JSON.parse(raw) : null; }catch(e){ L = null; }
      var serverPub = ENC.pubAt || null, conflict = false;
      if(!L || !L.enc) return {P:P, L:null};
      if(serverPub){
        if(!L.unpub) return {P:P, L:null};
        if(L.base !== serverPub) conflict = true;
      } else if(!(Date.parse(L.savedAt) > Date.parse(P.data.savedAt))) return {P:P, L:null};
      var lsalt = b64d(L.enc.salt);
      var kp = (L.enc.salt===ENC.salt && L.enc.iter===ENC.iter) ? Promise.resolve(fkey) : derive(pw, lsalt, L.enc.iter);
      return kp.then(function(lkey){
        return decryptWith(lkey, L.enc).then(function(LP){ if(conflict) return {P:P, L:null, C:LP, CL:L}; CK = {key:lkey, salt:lsalt, iter:L.enc.iter}; return {P:P, L:LP}; });
      }).catch(function(){ return {P:P, L:null}; });
    });
  });
}
(function boot(){
  var f = document.getElementById('lockf'), inp = document.getElementById('pw'), btn = document.getElementById('pwbtn'), msg = document.getElementById('lkmsg');
  if(!(window.crypto && crypto.subtle)){ msg.textContent = '当前浏览器不支持解密，请用 Chrome / Safari / Edge 打开'; btn.disabled = true; return; }
  btn.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = '正在载入数据…';
  loadEnc().then(function(e){
    if(!e){ msg.style.color=''; msg.textContent = '数据载入失败，请检查网络后刷新'; return; }
    ENC = e; btn.disabled = false; msg.textContent = '';
    var remembered = ssGet(SSKEY);
    if(remembered) go(remembered, true); else inp.focus();
  });
  function go(pw, silent){
    btn.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = '正在解密…';
    unlock(pw).then(function(r){
      ssSet(SSKEY, pw); CURPW = pw; msg.textContent = '';
      document.body.classList.remove('locked');
      main(r.P, r.L, r.C);
    }).catch(function(){
      btn.disabled = false; msg.style.color = ''; msg.textContent = silent ? '' : '密码不正确';
      ssSet(SSKEY, null); inp.value = ''; inp.focus();
    });
  }
  f.addEventListener('submit', function(e){ e.preventDefault(); if(inp.value && ENC) go(inp.value); });
})();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

}

/* ---------- links ---------- */
var STOP = ['总经理','先生','小姐','女士','经理','总监','董事','执行董事','联合创始人'];
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function isLat(c){ return !!c && /[A-Za-z0-9]/.test(c); }
function allRecs(){ var a=[]; DATA.sheets.forEach(function(s){ s.records.forEach(function(r){ a.push(r); }); }); return a; }
function recAliases(r){ var a=(r.alias||[]).slice(); if(r.f.company) a.push(r.f.company); return a.map(function(x){return String(x).trim();}).filter(function(x){return x.length>=2;}); }

function label(id){
  if(id.indexOf('h:')===0){ var h=hubById(id.slice(2)); return h?h.name:'?'; }
  var fr=findRec(id); if(!fr) return '?'; return fr.r.short || fr.r.f.company || '?';
}
function sheetOf(id){ var fr=findRec(id); return fr?fr.sh.id:null; }
function linkIndex(){
  if(LCACHE && LCACHE.v===LV) return LCACHE;
  var map={}, keys=[];
  allRecs().forEach(function(r){ recAliases(r).forEach(function(a){ var k=a.toLowerCase(); if(!map[k]){ map[k]={type:'r',id:r.id}; keys.push(a); } }); });
  (DATA.hubs||[]).forEach(function(h){ [h.name].concat(h.alias||[]).forEach(function(a){ a=String(a||'').trim(); if(a.length<2) return; var k=a.toLowerCase(); if(!map[k]){ map[k]={type:'h',id:h.id}; keys.push(a); } }); });
  keys.sort(function(x,y){ return y.length-x.length; });
  LCACHE = {v:LV, map:map, keys:keys, loc:{}, re: keys.length ? new RegExp(keys.map(reEsc).join('|'),'gi') : null};
  LCACHE.g = buildGraph();
  return LCACHE;
}
function scan(text, selfId, cb){
  var L = linkIndex(); if(!L.re) return; var re = new RegExp(L.re.source,'gi'), m, lmap = null;
  var fr0 = selfId ? findRec(selfId) : null, la = fr0 && fr0.r.localAlias;
  if(la && Object.keys(la).length){
    if(!L.loc[selfId]){ var ks = L.keys.concat(Object.keys(la)).sort(function(x,y){return y.length-x.length;}); var lm={}; Object.keys(la).forEach(function(k){ lm[k.toLowerCase()]={type:'r',id:la[k]}; }); L.loc[selfId]={src:ks.map(reEsc).join('|'), map:lm}; }
    re = new RegExp(L.loc[selfId].src,'gi'); lmap = L.loc[selfId].map;
  }
  while((m = re.exec(text))){
    var s=m.index, e=s+m[0].length, tg=(lmap && lmap[m[0].toLowerCase()]) || L.map[m[0].toLowerCase()];
    if(!tg || (tg.type==='r' && tg.id===selfId)) continue;
    if(/[A-Za-z]/.test(m[0]) && (isLat(text.charAt(s-1)) || isLat(text.charAt(e)))) continue;
    cb(s,e,tg);
  }
}
function snip(v,s,e){ var a=Math.max(0,s-20), b=Math.min(v.length,e+22); return {pre:(a>0?'…':'')+v.slice(a,s).replace(/\s+/g,' '), hit:v.slice(s,e), post:v.slice(e,b).replace(/\s+/g,' ')+(b<v.length?'…':'')}; }
function buildGraph(){
  var edges={}, rid={};
  function key(a,b){ return a<b ? a+'|'+b : b+'|'+a; }
  function add(a,b,rel){ var k=key(a,b); (edges[k]=edges[k]||{a:a,b:b,rels:[]}).rels.push(rel); }
  allRecs().forEach(function(r){
    r.visits.forEach(function(v,vi){ var seen={};
      scan(v, r.id, function(s,e,tg){ var to=(tg.type==='h'?'h:':'')+tg.id; if(seen[to]) return; seen[to]=1;
        add(r.id, to, {kind: tg.type==='h'?'hub':'mention', from:r.id, to:to, vi:vi, snip:snip(v,s,e)}); });
    });
  });
  var tok={};
  allRecs().forEach(function(r){ var seen={}; (String(r.f.contact||'').match(/[\u4e00-\u9fff]{2,4}/g)||[]).forEach(function(x){ if(STOP.indexOf(x)<0 && !seen[x]){ seen[x]=1; (tok[x]=tok[x]||[]).push(r.id); } }); });
  Object.keys(tok).forEach(function(x){ var ids=tok[x]; for(var i=0;i<ids.length;i++) for(var j=i+1;j<ids.length;j++) add(ids[i],ids[j],{kind:'same',name:x}); });
  var grp={}; allRecs().forEach(function(r){ var gname=String(r.group||'').trim(); if(gname) (grp[gname]=grp[gname]||[]).push(r.id); });
  Object.keys(grp).forEach(function(x){ var ids=grp[x]; for(var i=0;i<ids.length;i++) for(var j=i+1;j<ids.length;j++) add(ids[i],ids[j],{kind:'group',name:x}); });
  var E = Object.keys(edges).map(function(k){ return edges[k]; });
  // hubs need >=2 clients
  var hdeg={}; E.forEach(function(e){ [e.a,e.b].forEach(function(n){ if(n.indexOf('h:')===0) hdeg[n]=(hdeg[n]||0)+1; }); });
  E = E.filter(function(e){ return !((e.a.indexOf('h:')===0 && hdeg[e.a]<2) || (e.b.indexOf('h:')===0 && hdeg[e.b]<2)); });
  var deg={}; E.forEach(function(e){ deg[e.a]=(deg[e.a]||0)+1; deg[e.b]=(deg[e.b]||0)+1; });
  return {edges:E, deg:deg, nodes:Object.keys(deg)};
}
function relsOf(id){
  var g=linkIndex().g, out=[];
  g.edges.forEach(function(e){ if(e.a!==id && e.b!==id) return; var o = e.a===id?e.b:e.a;
    e.rels.forEach(function(r){ out.push({other:o, rel:r}); }); });
  var order={mention:0, hub:2, same:1};
  out.sort(function(x,y){ var dx = x.rel.kind==='mention' ? (x.rel.from===id?0:1) : ((x.rel.kind==='same'||x.rel.kind==='group')?2:3); var dy = y.rel.kind==='mention' ? (y.rel.from===id?0:1) : ((y.rel.kind==='same'||y.rel.kind==='group')?2:3); return dx-dy; });
  return out;
}

function linkify(text, selfId, vi){
  var out='', last=0;
  scan(text, selfId, function(s,e,tg){ if(s<last) return;
    out += hl(text.slice(last,s));
    out += '<a class="xref'+(tg.type==='h'?' hub':'')+'" data-act="'+(tg.type==='h'?'hub':'goto')+'" data-to="'+tg.id+'" data-from="'+selfId+'" data-fvi="'+vi+'">'+hl(text.slice(s,e))+'</a>';
    last=e; });

    }
    g.edges.forEach(function(e){ var a=pos[e.a], b=pos[e.b], dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)+0.01, f=(d-K)*0.06; a.fx+=dx/d*f; a.fy+=dy/d*f; b.fx-=dx/d*f; b.fy-=dy/d*f; });
    for(i=0;i<N;i++){ p=pos[g.nodes[i]]; var m=Math.sqrt(p.fx*p.fx+p.fy*p.fy), lim=12*temp+0.5; if(m>lim){ p.fx*=lim/m; p.fy*=lim/m; } p.x+=p.fx; p.y+=p.fy; }
  }

}
function graphHTML(){

  var pad=60; g.box={x:minx-pad, y:miny-pad, w:(maxx-minx)+pad*2, h:(maxy-miny)+pad*2};

    var dim = sel && !nb[n] ? ' dim' : '';
    var qh = '';

    s+='<g class="n'+(n===sel?' sel':'')+dim+qh+'" data-node="'+n+'" transform="translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')">';
    s+= isH ? '<rect x="'+(-r)+'" y="'+(-r)+'" width="'+(2*r)+'" height="'+(2*r)+'" rx="5" fill="'+col+'"/>' : '<circle r="'+r+'" fill="'+col+'"/>';
    s+='<text y="'+(r+14)+'" text-anchor="middle">'+esc(label(n))+'</text></g>';
  });
  s+='</g></svg>';
  var h='<div class="g-box">'+s+'<div class="g-tools"><button data-act="gz" data-z="0.8" aria-label="放大">＋</button><button data-act="gz" data-z="1.25" aria-label="缩小">－</button><button data-act="gfit" aria-label="复位" style="font-size:13px">⤢</button></div>'
    + '<div class="g-legend">'+DATA.sheets.map(function(s){ return '<span><i style="background:'+sheetColor(s.id)+'"></i>'+esc(s.short||s.name)+'</span>'; }).join('')+((DATA.hubs||[]).length?'<span><i class="sq" style="background:var(--hub)"></i>关键人物</span>':'')+'<span><i class="ln"></i>记录中提到（箭头指向被提到的一方）</span><span><i class="ln d"></i>同一联系人 / 同集团</span><span><i class="ln h"></i>与关键人物相关</span></div></div>';

  comps.sort(function(a,b){ return b.length-a.length; });

  });

  return h;
}
function rad(n,g){ return 7+Math.min(9, (g.deg[n]||1)*1.6); }
function panelHTML(sel){
  if(!sel) return '<div class="g-hint">点一个圆点查看它和谁有关联；双指或滚轮缩放，拖动平移。下面的「关系群」也可以直接点。</div>';
  var isH = sel.indexOf('h:')===0, items=relsOf(sel);

  if(!isH){ var fr=findRec(sel); h+='<div class="sub">'+esc(fr.sh.name)+(fr.r.f.contact?'<span class="sep">|</span>'+esc(fr.r.f.contact):'')+'</div>'; }
  else h+='<div class="sub">关键人物</div>';

function setVB(){ var s=document.getElementById('gsvg'); if(s) s.setAttribute('viewBox',[GV.x,GV.y,GV.w,GV.h].join(' ')); }
function zoomAt(f, cx, cy){ var nw=Math.max(80, Math.min(GV.w*f, 6000)); f=nw/GV.w; GV.x=cx-(cx-GV.x)*f; GV.y=cy-(cy-GV.y)*f; GV.w*=f; GV.h*=f; setVB(); }
function bindGraph(){
  var svg=document.getElementById('gsvg'); if(!svg) return;
  var pts={}, start=null, moved=false, downNode=null;
  function toSvg(cx,cy){ var r=svg.getBoundingClientRect(); var sc=Math.max(GV.w/r.width, GV.h/r.height); var ox=(r.width*sc-GV.w)/2, oy=(r.height*sc-GV.h)/2; return {x:GV.x-ox+(cx-r.left)*sc, y:GV.y-oy+(cy-r.top)*sc, sc:sc}; }

  svg.addEventListener('pointermove', function(e){ if(!pts[e.pointerId]) return; pts[e.pointerId]={x:e.clientX,y:e.clientY}; var k=Object.keys(pts);
    if(k.length>=2 && start.pd){ var a=pts[k[0]], b=pts[k[1]], d=Math.hypot(a.x-b.x,a.y-b.y); var c=toSvg((a.x+b.x)/2,(a.y+b.y)/2); zoomAt((start.w*start.pd/d)/GV.w, c.x, c.y); moved=true; return; }
    var dx=e.clientX-start.x, dy=e.clientY-start.y; if(Math.abs(dx)+Math.abs(dy)>6) moved=true; if(!moved) return;

/* ---------- images ---------- */
function compress(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var s = Math.min(1, 1000/Math.max(img.width,img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      var g = c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      var url = c.toDataURL('image/webp',0.7);
      if(url.indexOf('data:image/webp')!==0) url = c.toDataURL('image/jpeg',0.75);
      cb(url);
    };
    img.onerror = function(){ toast('无法读取这张图片'); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- publish to GitHub ---------- */
var GHKEY = 'visit-log::gh';
function ghCfg(){
  var c = {}; try{ c = JSON.parse(lsGet(GHKEY)||'{}')||{}; }catch(e){ c = {}; }
  var auto = {};
  if(/\.github\.io$/i.test(location.hostname)){ auto.owner = location.hostname.split('.')[0]; var seg = location.pathname.split('/').filter(Boolean); if(seg.length && !/\.html?$/i.test(seg[0])) auto.repo = seg[0]; }
  return {owner: c.owner || auto.owner || CFG.owner || '', repo: c.repo || auto.repo || CFG.repo || '', branch: c.branch || CFG.branch || 'main', path: c.path || CFG.path || 'data.enc.json', tok: c.tok || null};
}
function saveGhCfg(c){ lsSet(GHKEY, JSON.stringify(c)); }
function getToken(){ var c = ghCfg(); if(!c.tok) return Promise.resolve(null); return decryptWith(CK.key, c.tok).then(function(o){ return o.t; }).catch(function(){ return null; }); }
function setToken(tok){ var c = ghCfg(); if(!tok){ c.tok=null; saveGhCfg(c); return Promise.resolve(); } return encryptPayload({t:tok}).then(function(e){ c.tok = e; saveGhCfg(c); }); }
function ghFetch(path, tok, opt){
  opt = opt || {}; var h = {'Accept': opt.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json'};
  if(tok) h.Authorization = 'Bearer ' + tok;
  if(opt.body) h['Content-Type'] = 'application/json';
  return fetch('https://api.github.com' + path, {method: opt.method||'GET', headers:h, body: opt.body ? JSON.stringify(opt.body) : undefined, cache:'no-store'});
}
function openPubSet(){
  var c = ghCfg();
  var h='<div class="overlay" data-act="closeNew"><div class="sheet" data-stop="1"><h2>发布设置</h2><div class="g-hint" style="margin-bottom:6px">每台用来「发布」的设备设置一次即可。授权码会用打开文件的密码加密后，只存在这台设备上。</div><div class="form">'
   + '<label>GitHub 用户名<input id="gh-o" value="'+esc(c.owner)+'" autocapitalize="off"></label>'
   + '<label>仓库名<input id="gh-r" value="'+esc(c.repo)+'" autocapitalize="off"></label>'
   + '<label>分支<input id="gh-b" value="'+esc(c.branch)+'" autocapitalize="off"></label>'
   + '<label>授权码（fine-grained token）<input id="gh-t" type="password" autocomplete="off" placeholder="'+(c.tok?'已保存（留空则不变）':'github_pat_…')+'"></label>'
   + '<div class="actions"><button class="btn pri" data-act="pubSetSave">保存并测试</button><button class="btn" data-act="closeNew">取消</button>'+(c.tok?'<button class="btn dan" data-act="pubSetClear" style="margin-left:auto">清除授权码</button>':'')+'</div><div class="g-hint" id="gh-msg"></div></div></div></div>';
  document.getElementById('layer').innerHTML = h;
}
function pubSetSave(){
  var c = ghCfg(), msg = document.getElementById('gh-msg');
  c.owner = document.getElementById('gh-o').value.trim(); c.repo = document.getElementById('gh-r').value.trim(); c.branch = document.getElementById('gh-b').value.trim() || 'main';
  var nt = document.getElementById('gh-t').value.trim();
  saveGhCfg(c);
  msg.textContent = '正在测试…';
  (nt ? setToken(nt).then(function(){ return nt; }) : getToken()).then(function(tok){
    if(!tok){ msg.textContent = '还没有填授权码'; return; }
    return ghFetch('/repos/'+c.owner+'/'+c.repo, tok).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, s:r.status, j:j}; }); }).then(function(x){
      if(!x.ok){ msg.textContent = x.s===401 ? '授权码无效或已过期' : (x.s===404 ? '找不到这个仓库，或授权码没有这个仓库的权限' : '连接失败（'+x.s+'）'); return; }
      if(!(x.j.permissions && x.j.permissions.push)){ msg.textContent = '能看到仓库，但授权码没有写入权限（需要 Contents: Read and write）'; return; }
      document.getElementById('layer').innerHTML=''; toast('设置成功，可以发布了');
    });
  }).catch(function(){ msg.textContent = '网络错误，请稍后再试'; });
}
function usedImages(){ var used = {}; DATA.sheets.forEach(function(s){ s.records.forEach(function(r){ r.cards.forEach(function(c){ if(c.img) used[c.img]=IMAGES[c.img]; }); }); }); return used; }
function fmtTime(iso){ var d=new Date(iso); if(isNaN(d)) return iso||''; function p(n){return (n<10?'0':'')+n;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function publish(){
  if(PUBBING) return;
  var c = ghCfg();
  getToken().then(function(tok){
    if(!tok || !c.owner || !c.repo){ openPubSet(); toast('请先完成发布设置'); return; }
    PUBBING = true; renderBanner();
    var api = '/repos/'+c.owner+'/'+c.repo+'/contents/'+c.path;
    var sha = null;
    return ghFetch(api+'?ref='+encodeURIComponent(c.branch), tok).then(function(r){
      if(r.status===404) return null;
      if(!r.ok) throw {s:r.status};
      return r.json().then(function(j){ sha = j.sha; return ghFetch(api+'?ref='+encodeURIComponent(c.branch), tok, {raw:true}).then(function(r2){ return r2.ok ? r2.json() : null; }); });
    }).then(function(cur){
      if(cur && cur.pubAt && BASE && cur.pubAt !== BASE){
        if(!confirm('服务器上有一个 '+fmtTime(cur.pubAt)+' 发布的版本，比你开始修改时的版本新（可能是在另一台设备上发布的）。\n\n继续发布会覆盖它。确定继续吗？')) throw {cancel:1};
      }
      var pubAt = new Date().toISOString();
      return encryptPayload({data:DATA, images:usedImages()}).then(function(e){
        e.pubAt = pubAt;
        var body = {message:'更新数据 '+fmtTime(pubAt), content: btoa(JSON.stringify(e)), branch: c.branch};
        if(sha) body.sha = sha;
        return ghFetch(api, tok, {method:'PUT', body:body}).then(function(r){ if(!r.ok) throw {s:r.status}; return {pubAt:pubAt, e:e}; });
      });
    }).then(function(x){
      PUBBING = false; BASE = x.pubAt; dirty = false; CONFLICT = null;
      lsSet(LSKEY, JSON.stringify({savedAt:DATA.savedAt, base:BASE, unpub:false, enc:x.e}));
      renderBanner(); toast('已发布，约 1 分钟后其他设备刷新即可看到');
    });
  }).catch(function(err){
    PUBBING = false; renderBanner();
    if(err && err.cancel) return;
    var s = err && err.s;
    renderBanner(s===401 ? '发布失败：授权码无效或已过期，请到「发布设置」更新。' : s===403||s===404 ? '发布失败：授权码没有这个仓库的写入权限。' : s===409 ? '发布失败：服务器上的文件刚被改动，请稍后再试。' : '发布失败：网络错误，请稍后再试。修改仍保存在本机。');
  });
}
function checkNewer(){
  if(!SERVER) return;
  var c = ghCfg(); if(!c.tok || !c.owner || !c.repo) return;
  getToken().then(function(tok){
    if(!tok) return;
    return ghFetch('/repos/'+c.owner+'/'+c.repo+'/contents/'+c.path+'?ref='+encodeURIComponent(c.branch), tok, {raw:true}).then(function(r){ return r.ok ? r.json() : null; }).then(function(cur){
      if(!cur || !cur.pubAt || !BASE || !(Date.parse(cur.pubAt) > Date.parse(BASE))) return;
      if(dirty){ toast('服务器上有更新的版本（'+fmtTime(cur.pubAt)+'），发布时会提示'); return; }
      var ks = (cur.salt===b64e(CK.salt) && cur.iter===CK.iter) ? Promise.resolve(CK.key) : derive(CURPW, b64d(cur.salt), cur.iter);
      return ks.then(function(k){ return decryptWith(k, cur).then(function(P2){
        DATA = P2.data; IMAGES = P2.images; BASE = cur.pubAt; LV++; CK = {key:k, salt:b64d(cur.salt), iter:cur.iter};
        DATA.hubs = DATA.hubs || []; render(); renderBanner(); toast('已载入最新发布的版本');
      }); });
    });
  }).catch(function(){});
}

    case 'addVisitCancel': delete ui.adding[id]; rerenderRec(id); break;
    case 'addVisitSave':
      var txt = (ui.adding[id]||'').trim(); if(!txt || txt===today()){ toast('记录内容为空'); return; }
      findRec(id).r.visits.push(txt); delete ui.adding[id]; persist(); renderTabs(); rerenderRec(id); toast('已保存'); break;
    case 'edit': fr = findRec(id); ui.drafts[id] = JSON.parse(JSON.stringify({f:fr.r.f, visits:fr.r.visits, cards:fr.r.cards, short:fr.r.short||'', group:fr.r.group||'', aliasText:(fr.r.alias||[]).join('、')})); delete ui.adding[id]; rerenderRec(id); break;
    case 'editCancel': delete ui.drafts[id]; rerenderRec(id); break;
    case 'editSave':
      fr = findRec(id); d = ui.drafts[id];
      Object.keys(d.f).forEach(function(k){ d.f[k] = String(d.f[k]==null?'':d.f[k]); });
      fr.r.f = d.f; fr.r.visits = d.visits.filter(function(v){return String(v).trim();}); fr.r.cards = d.cards.filter(function(c){return (c.text||'').trim()||c.img;}); fr.r.short = (d.short||'').trim(); fr.r.group = (d.group||'').trim(); fr.r.alias = splitAlias(d.aliasText);
      if(d.sheet && d.sheet!==fr.sh.id){ var tsh=DATA.sheets.filter(function(s){return s.id===d.sheet;})[0]; if(tsh){ fr.sh.records.splice(fr.i,1); tsh.records.push(fr.r); fr.r.f.no = fr.r.f.no||''; ui.tab=tsh.id; } }
      delete ui.drafts[id]; persist(); render(); if(d.sheet){ var el2=document.querySelector('.rec[data-id="'+id+'"]'); if(el2) el2.scrollIntoView({block:'center'}); } toast('已保存修改'); break;
    case 'vAdd': ui.drafts[id].visits.push(today()+' '); rerenderRec(id); break;
    case 'vDel': if(confirm('删除这条拜访记录？')){ ui.drafts[id].visits.splice(+t.dataset.i,1); rerenderRec(id);} break;
    case 'vUp': i=+t.dataset.i; if(i>0){ d=ui.drafts[id].visits; var x=d[i]; d[i]=d[i-1]; d[i-1]=x; rerenderRec(id);} break;
    case 'cAdd': ui.drafts[id].cards.push({img:null,text:''}); rerenderRec(id); break;
    case 'cDel': if(confirm('删除这张名片？')){ ui.drafts[id].cards.splice(+t.dataset.i,1); rerenderRec(id);} break;
    case 'recDel': fr = findRec(id); if(confirm('确定删除「'+(fr.r.f.company||'')+'」及其全部记录？')){ fr.sh.records.splice(fr.i,1); delete ui.drafts[id]; persist(); render(); toast('已删除'); } break;
    case 'new': openNew(); break;
    case 'publish': if(menu) menu.remove(); publish(); break;
    case 'pubset': if(menu) menu.remove(); openPubSet(); break;
    case 'pubSetSave': pubSetSave(); break;
    case 'pubSetClear': setToken(null).then(function(){ document.getElementById('layer').innerHTML=''; toast('已清除授权码'); }); break;
    case 'useLocal': if(confirm('改用这台设备上未发布的版本？发布时会覆盖服务器上较新的内容。')){ DATA = CONFLICT.data; IMAGES = CONFLICT.images || IMAGES; CONFLICT = null; dirty = true; LV++; persist(); render(); } break;
    case 'dropLocal': if(confirm('丢弃这台设备上未发布的修改？')){ CONFLICT = null; lsSet(LSKEY, ''); renderBanner(); } break;
    case 'cats': if(menu) menu.remove(); openCats(); break;
    case 'catAdd': catDraft.push({id:'c'+uid(), short:'', name:'', n:0, isNew:true}); renderCats(); var ins=document.querySelectorAll('.cat-row input'); if(ins.length) ins[ins.length-2].focus(); break;
    case 'catUp': i=+t.dataset.i; if(i>0){ var cx=catDraft[i]; catDraft[i]=catDraft[i-1]; catDraft[i-1]=cx; renderCats(); } break;
    case 'catDel': i=+t.dataset.i; if(catDraft[i].n>0){ toast('这个类别下还有客户，请先在客户「编辑」里改到其他类别'); return; } if(catDraft.length<2){ toast('至少保留一个类别'); return; } catDraft.splice(i,1); renderCats(); break;
    case 'catSave': saveCats(); break;
    case 'lock': ssSet(SSKEY, null); location.reload(); break;
    case 'chpw': if(menu) menu.remove();
      document.getElementById('layer').innerHTML = '<div class="overlay" data-act="closeNew"><div class="sheet" data-stop="1"><h2>修改密码</h2><div class="form"><label>新密码<input type="password" id="np1" autocomplete="new-password"></label><label>再输入一次<input type="password" id="np2" autocomplete="new-password"></label><div class="actions"><button class="btn pri" data-act="chpwSave">确定</button><button class="btn" data-act="closeNew">取消</button></div></div></div></div>';
      setTimeout(function(){ var x=document.getElementById('np1'); if(x) x.focus(); }, 50); break;
    case 'chpwSave':
      var p1 = document.getElementById('np1').value, p2 = document.getElementById('np2').value;
      if(!p1){ toast('请输入新密码'); return; } if(p1!==p2){ toast('两次输入不一致'); return; }
      var ns = crypto.getRandomValues(new Uint8Array(16));
      getToken().then(function(oldTok){ return derive(p1, ns, 600000).then(function(k){ return {k:k, tok:oldTok}; }); }).then(function(o){ var k=o.k;
        CK = {key:k, salt:ns, iter:600000}; ssSet(SSKEY, p1); CURPW = p1; if(o.tok) setToken(o.tok);
        document.getElementById('layer').innerHTML = ''; persist();
        renderBanner(SERVER ? '密码已修改。点「发布」后，所有人都要用新密码打开。' : '密码已修改。请「下载更新文件」并替换旧文件，否则旧文件仍使用旧密码。');
      }); break;
    case 'closeNew': newDraft=null; document.getElementById('layer').innerHTML=''; break;
    case 'saveNew': saveNew(); break;
  }
});
document.addEventListener('input', function(e){
  var t = e.target, a = t.dataset.actInput; if(!a) return;
  var id = t.dataset.id;
  if(a==='adding') ui.adding[id] = t.value;
  else if(a==='df') ui.drafts[id].f[t.dataset.k] = t.value;
  else if(a==='dv') ui.drafts[id].visits[+t.dataset.i] = t.value;
  else if(a==='dc') ui.drafts[id].cards[+t.dataset.i].text = t.value;
  else if(a==='dshort') ui.drafts[id].short = t.value;
  else if(a==='dalias') ui.drafts[id].aliasText = t.value;
  else if(a==='dgroup') ui.drafts[id].group = t.value;
  else if(a==='dsheet') ui.drafts[id].sheet = t.value;
  else if(a==='nsheet') newDraft.sheet = t.value;
  else if(a==='nf') newDraft.f[t.dataset.k] = t.value;
  else if(a==='cs') catDraft[+t.dataset.i].short = t.value;
  else if(a==='cn') catDraft[+t.dataset.i].name = t.value;
  else if(a==='nv') newDraft.visit = t.value;
  else if(a==='nc') newDraft.card = t.value;
});
document.addEventListener('change', function(e){
  if(e.target.tagName==='SELECT' && e.target.dataset.actInput){ e.target.dispatchEvent(new Event('input',{bubbles:true})); return; }
  var t = e.target, a = t.dataset.actFile; if(!a || !t.files || !t.files[0]) return;
  compress(t.files[0], function(url){
    if(a==='nimg'){ newDraft.img = url; renderNew(); }
    else { var k = uid(); IMAGES[k] = url; ui.drafts[t.dataset.id].cards[+t.dataset.i].img = k; rerenderRec(t.dataset.id); }
  });
});
var qi = document.getElementById('q'), qt;
qi.addEventListener('input', function(){ clearTimeout(qt); qt = setTimeout(function(){ ui.q = qi.value; render(); }, 150); });
document.getElementById('sort').addEventListener('change', function(e){ ui.sort = e.target.value; renderList(); });
var sp = document.getElementById('split'); sp.checked = ui.split;
sp.addEventListener('change', function(){ ui.split = sp.checked; lsSet('visit-log::split', sp.checked?'1':'0'); renderList(); });
document.addEventListener('focusin', function(e){ if(e.target.matches('textarea,.form input')) document.body.classList.add('editing'); });
document.addEventListener('focusout', function(){ document.body.classList.remove('editing'); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.getElementById('layer').innerHTML=''; });

document.getElementById('ttl').textContent = DATA.title;
renderBanner(); render(); checkNewer();
}
})();
</script>
</body>
</html>
